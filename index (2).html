<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fali jedan</title>
<!-- verzija 2 -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#EEF2F8;--card:#fff;--ink:#14213D;--mute:#5B6785;--blue:#1B3FA0;--ball:#D4F03C;--line:#D5DCEA;--onblue:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0F1626;--card:#18223A;--ink:#EAF0FF;--mute:#9AA7C7;--blue:#4C73E8;--line:#2A3858}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 90px}
.bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:14px 0 0;font-size:.9rem;color:var(--mute)}
.link{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;cursor:pointer;padding:0}
header{padding:10px 0 16px}
h1{font-size:2.6rem;font-weight:800;margin:0;letter-spacing:-.03em;line-height:1}
h1 span{background:var(--ball);color:#14213D;padding:0 .18em;border-radius:.2em}
header p{margin:8px 0 0;color:var(--mute)}
.note{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:.85rem;color:var(--mute);margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip,select,input{font:inherit;color:var(--ink)}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
select,input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sport{font-weight:800;font-size:1.15rem}
.lvl{font-size:.85rem;color:var(--mute)}
.meta{color:var(--mute);font-size:.95rem;margin:4px 0 12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--blue)}
.dot.on{background:var(--blue)}
.dot.you{background:var(--ball);border-color:var(--ball)}
.go{border:0;background:var(--blue);color:var(--onblue);font:inherit;font-weight:600;padding:9px 18px;border-radius:10px;cursor:pointer}
.go.out{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.go:disabled{opacity:.45;cursor:default}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ball);color:#14213D;border:0;font:inherit;font-weight:800;padding:14px 22px;border-radius:99px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--ink);padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(10,15,30,.6)}
label{display:block;font-size:.9rem;color:var(--mute);margin:12px 0 4px}
.empty{text-align:center;color:var(--mute);padding:36px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<div class="bar"><span id="who"></span><button class="link" id="auth"></button></div>
<header>
<h1>Fali <span>jedan</span></h1>
<p>Nađi ekipu za sport u svom gradu. Termin je već dogovoren, fali još samo tvoja reketa, lopta ili tenisice.</p>
</header>
<div class="note" id="note" hidden>Demo način: termini se spremaju samo u ovom pregledniku. Za pravu bazu upiši Supabase podatke na vrhu skripte.</div>
<div class="chips" id="sports" role="group" aria-label="Sport"></div>
<select id="level" aria-label="Razina"><option value="">Sve razine</option><option>Početnik</option><option>Rekreativac</option><option>Napredni</option></select>
<div class="note" id="err" hidden style="color:#b00020;border-color:#b00020"></div>
<div id="list"><div class="empty">Učitavam termine...</div></div>
</div>
<button class="fab" id="add">+ Objavi termin</button>

<dialog id="dlg">
<strong style="font-size:1.2rem">Novi termin</strong>
<label for="fSport">Sport</label><select id="fSport"></select>
<label for="fPlace">Mjesto</label><input id="fPlace" placeholder="npr. Park Maksimir">
<label for="fWhen">Kada</label><input id="fWhen" type="datetime-local">
<label for="fLevel">Razina</label><select id="fLevel"><option>Početnik</option><option selected>Rekreativac</option><option>Napredni</option></select>
<label for="fNeed">Koliko igrača fali</label><select id="fNeed"><option>1</option><option>2</option><option>3</option><option>4</option></select>
<div class="row" style="margin-top:18px"><button class="go out" id="cancel">Odustani</button><button class="go" id="save">Objavi termin</button></div>
</dialog>

<dialog id="adlg">
<strong style="font-size:1.2rem" id="aTitle">Prijava</strong>
<div id="aName"><label for="aN">Ime (vidi se na terminima)</label><input id="aN" autocomplete="nickname"></div>
<div id="aMail"><label for="aE">E-mail</label><input id="aE" type="email" autocomplete="email">
<label for="aP">Lozinka (min. 6 znakova)</label><input id="aP" type="password" autocomplete="current-password"></div>
<div class="row" style="margin-top:18px"><button class="go out" id="aCancel">Odustani</button><span><button class="go out" id="aReg">Registriraj se</button> <button class="go" id="aLogin">Prijavi se</button></span></div>
</dialog>
<div id="toast" role="status"></div>

<script>
window.onerror=function(m){var e=document.getElementById("err");if(e){e.hidden=false;e.textContent="Greška u stranici: "+m}};
// ===== POSTAVKE: upiši svoje podatke iz Supabasea (Project Settings > API) =====
var SUPABASE_URL = "https://cufwqdctldtijzezcblv.supabase.co";
var SUPABASE_KEY = "sb_publishable_f2ElhKHdJAwPP7TtW9O6gw_FldlUp6u";
// ================================================================================

var REMOTE = !!(SUPABASE_URL && SUPABASE_KEY && window.supabase);
var sb = REMOTE ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
var SPORTS = ["Padel","Tenis","Košarka","Nogomet","Trčanje"];
var user = null, all = [], fSport = "";
function $(i){return document.getElementById(i)}
function toast(t){var e=$("toast");e.textContent=t;e.className="show";setTimeout(function(){e.className=""},2600)}
function fmt(s){var d=new Date(s);if(isNaN(d))return s;var n=["ned","pon","uto","sri","čet","pet","sub"];
return n[d.getDay()]+" "+d.getDate()+"."+(d.getMonth()+1)+". u "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}

// ---- sloj podataka (Supabase ili localStorage) ----
function lsGet(k,def){try{var v=JSON.parse(localStorage.getItem(k));return v==null?def:v}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
async function loadUser(){
  if(REMOTE){var r=await sb.auth.getSession();var u=r.data.session&&r.data.session.user;
    user=u?{id:u.id,name:(u.user_metadata&&u.user_metadata.name)||u.email}:null}
  else user=lsGet("fj_user",null)}
async function loadSessions(){
  if(REMOTE){var r=await sb.from("sessions").select("*, participants(user_id,user_name)").order("starts_at");
    if(r.error)throw r.error;
    all=r.data.map(function(s){return{id:s.id,sport:s.sport,place:s.place,when:s.starts_at,level:s.level,need:s.players_needed,
      host:s.host_name||"?",hostId:s.host_id,players:(s.participants||[]).map(function(p){return{id:p.user_id,name:p.user_name}})}})}
  else all=lsGet("fj_sessions",[])}
function saveLocal(){lsSet("fj_sessions",all)}

// ---- prikaz ----
function renderChips(){var box=$("sports");box.innerHTML="";
["Svi"].concat(SPORTS).forEach(function(s){var b=document.createElement("button");b.className="chip";b.textContent=s;
b.setAttribute("aria-pressed",(s==="Svi"&&!fSport)||s===fSport);
b.onclick=function(){fSport=s==="Svi"?"":s;renderChips();render()};box.appendChild(b)})}
function renderBar(){$("who").textContent=user?"Prijavljen: "+user.name:"";
$("auth").textContent=user?"Odjava":"Prijava";$("note").hidden=REMOTE}
function btn(txt,cls,fn){var b=document.createElement("button");b.className="go"+(cls?" "+cls:"");b.textContent=txt;b.onclick=fn;return b}
function render(){var box=$("list");box.innerHTML="";var lv=$("level").value;var cutoff=Date.now()-3600e3;
var items=all.filter(function(s){return(!fSport||s.sport===fSport)&&(!lv||s.level===lv)&&new Date(s.when).getTime()>=cutoff})
  .sort(function(a,b){return new Date(a.when)-new Date(b.when)});
if(!items.length){var e=document.createElement("div");e.className="empty";e.textContent="Nema termina za ove filtere. Objavi svoj pa će se netko pridružiti.";box.appendChild(e);return}
items.forEach(function(s){var c=document.createElement("div");c.className="card";
var free=s.need-s.players.length;var mine=user&&s.players.some(function(p){return p.id===user.id});var isHost=user&&s.hostId===user.id;
var top=document.createElement("div");top.className="top";
var a=document.createElement("span");a.className="sport";a.textContent=s.sport;
var l=document.createElement("span");l.className="lvl";l.textContent=s.level;top.appendChild(a);top.appendChild(l);
var m=document.createElement("div");m.className="meta";m.textContent=s.place+", "+fmt(s.when)+". Organizira "+s.host+".";
var r=document.createElement("div");r.className="row";
var dots=document.createElement("div");dots.className="dots";dots.setAttribute("aria-label","Slobodnih mjesta: "+free);
var d=document.createElement("span");d.className="dot on";dots.appendChild(d);
s.players.forEach(function(p){var x=document.createElement("span");x.className="dot "+(user&&p.id===user.id?"you":"on");x.title=p.name;dots.appendChild(x)});
for(var i=0;i<free;i++){var y=document.createElement("span");y.className="dot";dots.appendChild(y)}
var act;
if(isHost)act=btn("Obriši","out",function(){del(s)});
else if(mine)act=btn("Odjavi se","out",function(){leave(s)});
else if(free<=0){act=btn("Popunjeno","");act.disabled=true}
else act=btn("Pridruži se ("+free+" fali)","",function(){join(s)});
r.appendChild(dots);r.appendChild(act);c.appendChild(top);c.appendChild(m);c.appendChild(r);box.appendChild(c)})}
async function refresh(){try{await loadSessions()}catch(e){(function(){var b=$("err");b.hidden=false;b.textContent="Greška pri učitavanju: "+(e.message||e)})()}render()}

// ---- akcije ----
function needLogin(){if(user)return false;openAuth();toast("Prvo se prijavi");return true}
async function join(s){if(needLogin())return;
  try{if(REMOTE){var r=await sb.from("participants").insert({session_id:s.id,user_name:user.name});if(r.error)throw r.error}
  else{s.players.push({id:user.id,name:user.name});saveLocal()}
  toast("Prijavljen si!");await refresh()}catch(e){toast(e.message)}}
async function leave(s){try{
  if(REMOTE){var r=await sb.from("participants").delete().eq("session_id",s.id).eq("user_id",user.id);if(r.error)throw r.error}
  else{s.players=s.players.filter(function(p){return p.id!==user.id});saveLocal()}
  toast("Odjavljen si");await refresh()}catch(e){toast(e.message)}}
async function del(s){if(!confirm("Obrisati termin?"))return;try{
  if(REMOTE){var r=await sb.from("sessions").delete().eq("id",s.id);if(r.error)throw r.error}
  else{all=all.filter(function(x){return x.id!==s.id});saveLocal()}
  await refresh()}catch(e){toast(e.message)}}
async function create(){
  var p=$("fPlace").value.trim();if(!p){toast("Upiši mjesto termina");return}
  if(!$("fWhen").value){toast("Odaberi datum i vrijeme");return}
  var o={sport:$("fSport").value,place:p,when:new Date($("fWhen").value).toISOString(),level:$("fLevel").value,need:parseInt($("fNeed").value,10)};
  try{if(REMOTE){var r=await sb.from("sessions").insert({sport:o.sport,place:o.place,starts_at:o.when,level:o.level,players_needed:o.need,host_name:user.name});if(r.error)throw r.error}
  else{all.push({id:Date.now(),sport:o.sport,place:o.place,when:o.when,level:o.level,need:o.need,host:user.name,hostId:user.id,players:[]});saveLocal()}
  $("fPlace").value="";$("dlg").close();toast("Termin je objavljen");await refresh()}catch(e){toast(e.message)}}

// ---- prijava ----
function openAuth(){$("aMail").hidden=!REMOTE;$("aReg").hidden=!REMOTE;
  $("aLogin").textContent=REMOTE?"Prijavi se":"Nastavi";$("aTitle").textContent=REMOTE?"Prijava":"Kako te zovu?";
  $("aName").hidden=false;$("adlg").showModal()}
async function afterAuth(){await loadUser();renderBar();$("adlg").close();await refresh()}
$("aLogin").onclick=async function(){
  if(!REMOTE){var n=$("aN").value.trim();if(!n){toast("Upiši ime");return}
    lsSet("fj_user",{id:"local-"+Date.now().toString(36),name:n});return afterAuth()}
  var r=await sb.auth.signInWithPassword({email:$("aE").value.trim(),password:$("aP").value});
  if(r.error){toast("Prijava nije uspjela: "+r.error.message);return}afterAuth()};
$("aReg").onclick=async function(){var n=$("aN").value.trim();if(!n){toast("Upiši ime");return}
  var r=await sb.auth.signUp({email:$("aE").value.trim(),password:$("aP").value,options:{data:{name:n}}});
  if(r.error){toast("Registracija nije uspjela: "+r.error.message);return}
  if(!r.data.session){toast("Provjeri e-mail i potvrdi račun, pa se prijavi");$("adlg").close();return}afterAuth()};
$("aCancel").onclick=function(){$("adlg").close()};
$("auth").onclick=async function(){
  if(user){if(REMOTE)await sb.auth.signOut();else localStorage.removeItem("fj_user");user=null;renderBar();await refresh()}
  else openAuth()};

$("fSport").innerHTML=SPORTS.map(function(s){return"<option>"+s+"</option>"}).join("");
$("level").onchange=render;
$("add").onclick=function(){if(needLogin())return;$("dlg").showModal()};
$("cancel").onclick=function(){$("dlg").close()};
$("save").onclick=create;
renderChips();
loadUser().then(function(){renderBar();return refresh()});
</script>
</body>
</html>
